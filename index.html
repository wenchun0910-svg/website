<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識庫 | 童趣普普風</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Iansui Font (芫荽體) -->
    <style>
        @import url('https://cdn.jsdelivr.net/gh/ButTaiwan/iansui@0.9.1/webfont/iansui.css');
        
        body {
            font-family: 'Iansui', sans-serif;
            background-color: #FFF6F5; /* 極淺的復古粉白底色 */
            color: #1A1A1A;
            /* 普普風圓點背景，調小間距 */
            background-image: radial-gradient(#1A1A1A 1px, transparent 1px);
            background-size: 15px 15px;
            opacity: 0.98;
        }

        /* 普普風核心樣式：粗黑邊與硬陰影 */
        .pop-border {
            border: 2px solid #1A1A1A;
        }
        .pop-shadow {
            box-shadow: 3px 3px 0 0 #1A1A1A;
            transition: all 0.2s ease;
        }
        .pop-shadow:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 0 #1A1A1A;
        }
        .pop-shadow:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #1A1A1A;
        }

        /* 輸入框特化樣式 */
        .compact-input {
            padding: 0.4rem 0.75rem;
        }

        /* 隱藏捲軸保持乾淨 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FFF6F5; border-left: 2px solid #1A1A1A; }
        ::-webkit-scrollbar-thumb { background: #FFD13B; border-left: 2px solid #1A1A1A; }
        ::-webkit-scrollbar-thumb:hover { background: #FF4D4D; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        popBg: '#FFF6F5',     // 粉白底
                        popRed: '#FF4D4D',    // 亮紅 (刪除/警告)
                        popYellow: '#FFD13B', // 亮黃 (次要按鈕)
                        popBlue: '#4DB8FF',   // 亮藍 (主要動作)
                        popGreen: '#3BB143',  // 亮綠 (新增/成功)
                        popPurple: '#C197FF', // 亮紫 (裝飾/分類)
                        popPink: '#FF9EBB',   // 粉紅 (裝飾)
                        popInk: '#1A1A1A',    // 粗黑線條
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col text-base"> 

    <!-- Navigation Bar -->
    <nav class="bg-white border-b-2 border-popInk sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex justify-between items-center h-12">
                <div class="flex items-center gap-3">
                    <h1 id="siteTitleDisplay" class="text-xl font-bold tracking-widest text-popInk bg-popYellow px-3 py-0.5 rounded pop-border shadow-[2px_2px_0_0_#1a1a1a]">知識庫</h1>
                    <button id="editTitleBtn" onclick="editSiteTitle()" class="hidden text-sm bg-white pop-border rounded px-2 py-0.5 hover:bg-gray-100"><i class="fa-solid fa-pen"></i></button>
                </div>
                <div class="flex items-center gap-3">
                    <div id="userInfo" class="hidden items-center gap-2 font-bold bg-white px-3 py-1 rounded pop-border text-sm">
                        <span id="userEmail" class="text-sm"></span>
                        <span id="userRoleBadge" class="px-1.5 bg-popPurple text-white rounded text-xs"></span>
                        <button onclick="openPasswordModal()" class="hover:text-popRed text-sm ml-1" title="修改密碼"><i class="fa-solid fa-key"></i></button>
                    </div>
                    <button id="addBtn" onclick="openAddModal()" class="hidden bg-popGreen text-white px-3 py-1 rounded pop-border pop-shadow font-bold text-sm">
                        <i class="fa-solid fa-plus mr-1"></i> 新增
                    </button>
                    <button id="manageUsersBtn" onclick="openCollaboratorModal()" class="hidden bg-popPurple text-white px-3 py-1 rounded pop-border pop-shadow font-bold text-sm">
                        <i class="fa-solid fa-users mr-1"></i> 協作者
                    </button>
                    <button id="loginBtn" onclick="openAuthModal()" class="bg-popBlue text-white px-3 py-1 rounded pop-border pop-shadow font-bold text-sm">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i> 登入
                    </button>
                    <button id="logoutBtn" onclick="handleLogout()" class="hidden bg-white px-3 py-1 rounded pop-border pop-shadow font-bold text-sm">
                        登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-4 flex flex-col gap-4">
        
        <!-- Controls Section -->
        <div class="bg-white p-3 rounded-xl pop-border pop-shadow flex flex-col sm:flex-row gap-3 items-center justify-start">
            <div class="relative w-full sm:w-72 shrink-0">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-popInk"></i>
                <input type="text" id="searchInput" placeholder="搜尋關鍵字..." 
                    class="w-full pl-9 pr-3 py-2 bg-gray-50 pop-border rounded text-base focus:outline-none focus:bg-white font-bold transition-colors">
            </div>
            
            <div class="flex items-center gap-3 shrink-0 w-full sm:w-auto">
                <select id="categoryFilter" class="bg-white pop-border rounded px-3 py-2 text-base font-bold focus:outline-none cursor-pointer flex-grow sm:w-40 transition-colors">
                    <option value="all">所有分類</option>
                </select>
                <button id="manageCatBtn" onclick="openCategoryModal()" class="hidden bg-popYellow px-4 py-2 rounded pop-border pop-shadow font-bold text-base whitespace-nowrap hover:bg-yellow-400 transition-colors">
                    <i class="fa-solid fa-tags"></i> 分類
                </button>
            </div>
        </div>

        <!-- Links Grid -->
        <div id="linksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Loading indicator -->
            <div class="col-span-full flex justify-center py-10 text-popInk font-bold text-lg">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> 讀取魔法中...
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-between items-center bg-white p-3 rounded-lg pop-border pop-shadow hidden mt-auto text-sm font-bold">
            <span id="pageInfo">0 / 0</span>
            <div class="flex gap-2">
                <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1 bg-gray-50 pop-border rounded hover:bg-popYellow disabled:opacity-50 transition-colors">上一頁</button>
                <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1 bg-gray-50 pop-border rounded hover:bg-popYellow disabled:opacity-50 transition-colors">下一頁</button>
            </div>
        </div>

    </main>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-popInk/20 backdrop-blur-[2px] flex items-center justify-center z-50 hidden">
        <div class="bg-white pop-border shadow-[6px_6px_0_0_#1a1a1a] rounded-xl w-full max-w-sm p-5 relative mx-4">
            <button onclick="closeModal('authModal')" class="absolute -top-3 -right-3 bg-popRed text-white pop-border rounded-full w-8 h-8 flex items-center justify-center font-bold hover:scale-110 transition-transform"><i class="fa-solid fa-xmark text-sm"></i></button>
            
            <h2 class="text-lg font-bold text-popInk mb-4 text-center bg-popYellow pop-border py-1.5 rounded inline-block w-full">登入系統</h2>
            
            <div class="flex gap-2 mb-4">
                <button id="tabCollab" type="button" onclick="setAuthMode('login')" class="flex-1 py-1.5 text-sm font-bold bg-popBlue text-white pop-border rounded transition-colors">協作者</button>
                <button id="tabAdmin" type="button" onclick="setAuthMode('admin')" class="flex-1 py-1.5 text-sm font-bold bg-white text-popInk pop-border rounded hover:bg-gray-100 transition-colors">管理員</button>
            </div>

            <div id="authError" class="hidden mb-3 p-2 bg-popRed text-white text-sm font-bold rounded pop-border text-center"></div>
            
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="mb-3" id="usernameInputContainer">
                    <label class="block text-sm font-bold text-popInk mb-1">登入帳號</label>
                    <input type="text" id="usernameInput" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm" placeholder="請輸入帳號">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold text-popInk mb-1">密碼</label>
                    <input type="password" id="passwordInput" required minlength="6" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-popInk text-white font-bold py-2 rounded pop-border pop-shadow text-sm transition-transform" id="authSubmitBtn">登入</button>
            </form>
            
            <div class="mt-4 p-3 bg-popBg rounded text-xs text-popInk pop-border font-bold leading-relaxed">
                <p>⚠️ 預設管理密碼：<b>admin123</b></p>
                <p>⚠️ 協作者由管理員新增</p>
            </div>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-popInk/20 backdrop-blur-[2px] flex items-center justify-center z-50 hidden">
        <div class="bg-white pop-border shadow-[6px_6px_0_0_#1a1a1a] rounded-xl w-full max-w-sm p-5 relative mx-4">
            <button onclick="closeModal('passwordModal')" class="absolute -top-3 -right-3 bg-popRed text-white pop-border rounded-full w-8 h-8 flex items-center justify-center font-bold hover:scale-110 transition-transform"><i class="fa-solid fa-xmark text-sm"></i></button>
            <h2 class="text-lg font-bold text-popInk mb-4 text-center bg-popPink pop-border py-1.5 rounded">修改密碼</h2>
            
            <div id="pwdError" class="hidden mb-3 p-2 bg-popRed text-white text-sm font-bold rounded pop-border text-center"></div>
            <div id="pwdSuccess" class="hidden mb-3 p-2 bg-popGreen text-white text-sm font-bold rounded pop-border text-center">修改成功！</div>
            
            <form id="passwordForm" onsubmit="handleChangePassword(event)">
                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1">目前的密碼</label>
                    <input type="password" id="currentPwd" required class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold mb-1">新密碼 (至少6碼)</label>
                    <input type="password" id="newPwd" required minlength="6" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                </div>
                <button type="submit" class="w-full bg-popBlue text-white font-bold py-2 rounded pop-border pop-shadow text-sm transition-transform" id="pwdSubmitBtn">確認修改</button>
            </form>
        </div>
    </div>

    <!-- Collaborator Management Modal -->
    <div id="collaboratorModal" class="fixed inset-0 bg-popInk/20 backdrop-blur-[2px] flex items-center justify-center z-50 hidden">
        <div class="bg-white pop-border shadow-[6px_6px_0_0_#1a1a1a] rounded-xl w-full max-w-sm p-5 relative mx-4">
            <button onclick="closeModal('collaboratorModal')" class="absolute -top-3 -right-3 bg-popRed text-white pop-border rounded-full w-8 h-8 flex items-center justify-center font-bold hover:scale-110 transition-transform"><i class="fa-solid fa-xmark text-sm"></i></button>
            <h2 class="text-lg font-bold text-popInk mb-4 text-center bg-popPurple text-white pop-border py-1.5 rounded">新增協作者</h2>
            
            <div id="collabMsg" class="hidden mb-3 p-2 text-sm font-bold rounded pop-border text-center"></div>
            
            <form id="addCollabForm" onsubmit="handleAddCollaborator(event)">
                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1">帳號 ID</label>
                    <input type="text" id="newCollabUsername" required class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-bold mb-1">預設密碼</label>
                    <input type="text" id="newCollabPwd" required minlength="6" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                </div>
                <button type="submit" class="w-full bg-popInk text-white font-bold py-2 rounded pop-border pop-shadow text-sm transition-transform" id="collabSubmitBtn">建立帳號</button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="fixed inset-0 bg-popInk/20 backdrop-blur-[2px] flex items-center justify-center z-50 hidden">
        <div class="bg-white pop-border shadow-[6px_6px_0_0_#1a1a1a] rounded-xl w-full max-w-md p-5 relative mx-4">
            <button onclick="closeModal('itemModal')" class="absolute -top-3 -right-3 bg-popRed text-white pop-border rounded-full w-8 h-8 flex items-center justify-center font-bold hover:scale-110 transition-transform"><i class="fa-solid fa-xmark text-sm"></i></button>
            <h2 class="text-lg font-bold text-popInk mb-4 text-center bg-popGreen text-white pop-border py-1.5 rounded" id="itemModalTitle">新增資料</h2>
            
            <form id="itemForm" onsubmit="handleSaveItem(event)">
                <input type="hidden" id="itemId">
                
                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1">標題名稱</label>
                    <input type="text" id="itemTitle" required class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1 text-popBlue"><i class="fa-brands fa-google-drive"></i> 雲端文件 (選填)</label>
                    <input type="url" id="itemDriveUrl" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm" placeholder="https://...">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1 text-popPink"><i class="fa-solid fa-globe"></i> 一般網站 (選填)</label>
                    <input type="url" id="itemWebsiteUrl" class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm" placeholder="https://...">
                </div>

                <div id="itemFormError" class="hidden mb-3 p-2 bg-popRed text-white text-sm font-bold rounded pop-border text-center">請至少填寫一個連結！</div>

                <div class="mb-5">
                    <label class="block text-sm font-bold mb-1">分類</label>
                    <select id="itemCategory" required class="w-full compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                        <!-- Options generated dynamically -->
                    </select>
                </div>

                <button type="submit" class="w-full bg-popInk text-white font-bold py-2 rounded pop-border pop-shadow text-sm transition-transform" id="itemSubmitBtn">儲存</button>
            </form>
        </div>
    </div>

    <!-- Category Management Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-popInk/20 backdrop-blur-[2px] flex items-center justify-center z-50 hidden">
        <div class="bg-white pop-border shadow-[6px_6px_0_0_#1a1a1a] rounded-xl w-full max-w-sm p-5 relative mx-4">
            <button onclick="closeModal('categoryModal')" class="absolute -top-3 -right-3 bg-popRed text-white pop-border rounded-full w-8 h-8 flex items-center justify-center font-bold hover:scale-110 transition-transform"><i class="fa-solid fa-xmark text-sm"></i></button>
            <h2 class="text-lg font-bold text-popInk mb-4 text-center bg-popYellow pop-border py-1.5 rounded">管理分類</h2>
            
            <form id="addCategoryForm" onsubmit="handleAddCategory(event)" class="mb-4 flex gap-2">
                <input type="text" id="newCategoryName" required placeholder="新分類..." class="flex-grow compact-input bg-gray-50 pop-border rounded font-bold text-sm">
                <button type="submit" class="bg-popInk text-white px-3 py-1.5 rounded pop-border font-bold text-sm">新增</button>
            </form>

            <div class="max-h-48 overflow-y-auto bg-gray-50 pop-border rounded p-2 space-y-2" id="categoryManagerList">
                <!-- Categories -->
            </div>
        </div>
    </div>

    <!-- Scripts: Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === 1. Firebase Initialization ===
                  const firebaseConfig = {
  apiKey: "AIzaSyC_hAeSmuRluu6sNvgGvY95NxS3DPjuzWg",
  authDomain: "website-a6054.firebaseapp.com",
  projectId: "website-a6054",
  storageBucket: "website-a6054.firebasestorage.app",
  messagingSenderId: "574297102239",
  appId: "1:574297102239:web:d66832373222f7185b4faa"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-app';

        // === 2. Global State ===
        let currentAppUser = null; 
        let currentAppRole = null; 
        let currentUser = null;    
        let isAdmin = false;
        
        let allLinks = [];
        let filteredLinks = [];
        let systemCategories = [];
        
        // Pagination
        let currentPage = 1;
        const itemsPerPage = 9; // 9 items per page (3x3 grid)

        // Auth Modal State
        let authMode = 'login'; 

        // DOM Refs
        const DOM = {
            search: document.getElementById('searchInput'),
            category: document.getElementById('categoryFilter'),
            container: document.getElementById('linksContainer'),
            pagination: document.getElementById('pagination'),
            pageInfo: document.getElementById('pageInfo'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn')
        };

        // === 3. Auth Setup (Anonymous base) ===
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth Error:", error); }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user || null;
            if(user) setupFirestoreListener();
        });

        // App Level UI Update
        window.updateAuthUI = () => {
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const addBtn = document.getElementById('addBtn');
            const userInfo = document.getElementById('userInfo');
            const userEmail = document.getElementById('userEmail');
            const roleBadge = document.getElementById('userRoleBadge');

            if (currentAppRole) {
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                addBtn.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                
                if (currentAppRole === 'admin') {
                    isAdmin = true;
                    roleBadge.textContent = "管理";
                    roleBadge.className = "px-1.5 text-white bg-popInk pop-border rounded text-xs";
                    userEmail.classList.add('hidden');
                    document.getElementById('editTitleBtn').classList.remove('hidden');
                    document.getElementById('manageUsersBtn').classList.remove('hidden');
                } else {
                    isAdmin = false;
                    roleBadge.textContent = "協作";
                    roleBadge.className = "px-1.5 text-white bg-popBlue pop-border rounded text-xs";
                    userEmail.textContent = currentAppUser;
                    userEmail.classList.remove('hidden');
                    document.getElementById('editTitleBtn').classList.add('hidden');
                    document.getElementById('manageUsersBtn').classList.add('hidden');
                }
                document.getElementById('manageCatBtn').classList.remove('hidden');
            } else {
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                addBtn.classList.add('hidden');
                userInfo.classList.add('hidden');
                userInfo.classList.remove('flex');
                document.getElementById('editTitleBtn').classList.add('hidden');
                document.getElementById('manageCatBtn').classList.add('hidden');
                document.getElementById('manageUsersBtn').classList.add('hidden');
                isAdmin = false;
            }
            applyFiltersAndRender();
        }

        // === 4. Data Fetching ===
        let unsubscribeLinks = null;
        let unsubscribeConfig = null;
        let unsubscribeCategories = null;

        function setupFirestoreListener() {
            if (unsubscribeLinks) unsubscribeLinks();
            if (unsubscribeConfig) unsubscribeConfig();
            if (unsubscribeCategories) unsubscribeCategories();
            if (!currentUser) return;

            // Config
            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().siteTitle) {
                    const titleEl = document.getElementById('siteTitleDisplay');
                    if(titleEl && titleEl.tagName === 'H1') titleEl.textContent = docSnap.data().siteTitle;
                }
            });

            // Categories
            const catRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
            unsubscribeCategories = onSnapshot(catRef, (snapshot) => {
                systemCategories = [];
                snapshot.forEach(doc => systemCategories.push({ id: doc.id, ...doc.data() }));
                systemCategories.sort((a,b) => a.name.localeCompare(b.name));
                updateCategories();
                if(!document.getElementById('categoryModal').classList.contains('hidden')) renderCategoryManager();
            });

            // Links
            const linksRef = collection(db, 'artifacts', appId, 'public', 'data', 'links');
            unsubscribeLinks = onSnapshot(linksRef, (snapshot) => {
                allLinks = [];
                snapshot.forEach((doc) => allLinks.push({ id: doc.id, ...doc.data() }));
                updateCategories();
                applyFiltersAndRender();
            });
        }

        // === 5. Filter & Render ===
        function updateCategories() {
            const currentFilterVal = DOM.category.value;
            DOM.category.innerHTML = `<option value="all">所有分類</option>` + systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            if (systemCategories.find(c => c.name === currentFilterVal)) DOM.category.value = currentFilterVal;
            else DOM.category.value = 'all';

            const itemCatSelect = document.getElementById('itemCategory');
            if(itemCatSelect) {
                const currentItemCat = itemCatSelect.value;
                itemCatSelect.innerHTML = systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                if (currentItemCat && systemCategories.find(c => c.name === currentItemCat)) itemCatSelect.value = currentItemCat;
            }
        }

        function applyFiltersAndRender() {
            const searchTerm = DOM.search.value.toLowerCase().trim();
            const categoryFilter = DOM.category.value;

            filteredLinks = allLinks.filter(link => {
                const matchSearch = link.title.toLowerCase().includes(searchTerm) || (link.category && link.category.toLowerCase().includes(searchTerm));
                const matchCategory = categoryFilter === 'all' || link.category === categoryFilter;
                return matchSearch && matchCategory;
            });

            filteredLinks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            if ((currentPage - 1) * itemsPerPage >= filteredLinks.length) currentPage = 1;
            renderLinks();
        }

        function renderLinks() {
            if (filteredLinks.length === 0) {
                DOM.container.innerHTML = `<div class="col-span-full text-center py-12 font-bold text-gray-500 border-2 border-dashed border-gray-300 rounded-xl pop-border bg-white/50 text-lg">沒有找到相關魔法文件！</div>`;
                DOM.pagination.classList.add('hidden');
                return;
            }

            const totalPages = Math.ceil(filteredLinks.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredLinks.slice(startIndex, endIndex);

            DOM.container.innerHTML = pageData.map(link => generateCardHTML(link)).join('');

            DOM.pagination.classList.remove('hidden');
            DOM.pageInfo.textContent = `${startIndex + 1}-${Math.min(endIndex, filteredLinks.length)} / ${filteredLinks.length}`;
            DOM.prevBtn.disabled = currentPage === 1;
            DOM.nextBtn.disabled = currentPage === totalPages;
        }

        function generateCardHTML(link) {
            const dateStr = link.createdAt ? new Date(link.createdAt).toLocaleDateString('zh-TW').slice(5) : '未知';
            const views = link.views || 0;
            const dUrl = link.driveUrl || (link.type === 'document' ? link.url : '');
            const wUrl = link.websiteUrl || (link.type === 'website' ? link.url : '');

            let creatorDisplay = link.creatorName || (link.creatorEmail && link.creatorEmail.includes('@') ? '管理' : link.creatorEmail) || '精靈';

            let canEdit = currentAppRole === 'admin' || (currentAppRole === 'collab' && currentAppUser && (link.creatorName === currentAppUser || (link.creatorEmail && link.creatorEmail.includes(currentAppUser))));

            const actionsHtml = canEdit ? `
                <div class="flex gap-2 mt-3 pt-3 border-t-2 border-popInk">
                    <button onclick="editItem('${link.id}')" class="flex-1 text-xs font-bold bg-popYellow text-popInk pop-border rounded py-1 hover:bg-yellow-400 transition-colors">編輯</button>
                    <button onclick="deleteItem('${link.id}')" class="flex-1 text-xs font-bold bg-popRed text-white pop-border rounded py-1 hover:bg-red-600 transition-colors">刪除</button>
                </div>` : '';

            let linksHtml = '';
            if (dUrl) linksHtml += `<a href="${dUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${dUrl}')" class="text-xs font-bold text-white bg-popBlue px-2.5 py-1 pop-border pop-shadow rounded hover:-translate-y-0.5 transition-transform"><i class="fa-brands fa-google-drive"></i> 雲端</a>`;
            if (wUrl) linksHtml += `<a href="${wUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${wUrl}')" class="text-xs font-bold text-popInk bg-popPink px-2.5 py-1 pop-border pop-shadow rounded hover:-translate-y-0.5 transition-transform"><i class="fa-solid fa-globe"></i> 網站</a>`;

            return `
                <div class="bg-white p-4 rounded-xl pop-border pop-shadow flex flex-col justify-between h-full relative cursor-default hover:-translate-y-1 transition-transform">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2 py-0.5 bg-popPurple text-white text-xs font-bold pop-border rounded">${link.category || '未分類'}</span>
                            <span class="text-xs font-bold bg-gray-100 pop-border px-1.5 py-0.5 rounded flex items-center gap-1"><i class="fa-solid fa-fire text-popRed"></i> ${views}</span>
                        </div>
                        <h3 class="text-base font-bold text-popInk mb-3 line-clamp-2 leading-snug">${link.title}</h3>
                        <div class="flex flex-wrap gap-2 mb-3">${linksHtml}</div>
                    </div>
                    <div class="mt-auto">
                        <div class="flex justify-between items-center text-xs font-bold text-gray-500 border-t-2 border-dashed border-gray-200 pt-2">
                            <span><i class="fa-solid fa-user-pen"></i> ${creatorDisplay}</span>
                            <span>${dateStr}</span>
                        </div>
                        ${actionsHtml}
                    </div>
                </div>`;
        }

        // === 6. Global Functions & Listeners ===
        ['input', 'change'].forEach(evt => DOM.search.addEventListener(evt, () => { currentPage = 1; applyFiltersAndRender(); }));
        DOM.category.addEventListener('change', () => { currentPage = 1; applyFiltersAndRender(); });

        window.changePage = (d) => { currentPage += d; applyFiltersAndRender(); };
        window.incrementView = async (e, id, v, url) => {
            e.preventDefault(); window.open(url, '_blank');
            if(currentUser) try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'links', id), { views: v + 1 }); } catch(e){}
        };

        // Modals Toggle
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openAuthModal = () => { document.getElementById('authError').classList.add('hidden'); setAuthMode('login'); document.getElementById('authModal').classList.remove('hidden'); };
        window.openPasswordModal = () => { document.getElementById('passwordForm').reset(); document.getElementById('pwdError').classList.add('hidden'); document.getElementById('pwdSuccess').classList.add('hidden'); document.getElementById('passwordModal').classList.remove('hidden'); };
        window.openCollaboratorModal = () => { document.getElementById('addCollabForm').reset(); document.getElementById('collabMsg').classList.add('hidden'); document.getElementById('collaboratorModal').classList.remove('hidden'); };
        window.openCategoryModal = () => { renderCategoryManager(); document.getElementById('categoryModal').classList.remove('hidden'); };
        window.openAddModal = () => { document.getElementById('itemForm').reset(); document.getElementById('itemFormError').classList.add('hidden'); document.getElementById('itemId').value = ''; document.getElementById('itemModalTitle').textContent = '新增資料'; document.getElementById('itemModal').classList.remove('hidden'); };

        window.setAuthMode = (mode) => {
            authMode = mode;
            const tC = document.getElementById('tabCollab'), tA = document.getElementById('tabAdmin');
            const uc = document.getElementById('usernameInputContainer'), ui = document.getElementById('usernameInput');
            document.getElementById('authError').classList.add('hidden'); document.getElementById('passwordInput').value = '';
            
            if (mode === 'admin') {
                tA.className = "flex-1 py-1.5 text-sm font-bold bg-popInk text-white pop-border rounded transition-colors";
                tC.className = "flex-1 py-1.5 text-sm font-bold bg-white text-popInk pop-border rounded hover:bg-gray-100 transition-colors";
                uc.classList.add('hidden'); ui.required = false;
            } else {
                tC.className = "flex-1 py-1.5 text-sm font-bold bg-popBlue text-white pop-border rounded transition-colors";
                tA.className = "flex-1 py-1.5 text-sm font-bold bg-white text-popInk pop-border rounded hover:bg-gray-100 transition-colors";
                uc.classList.remove('hidden'); ui.required = true;
            }
        };

        // Title Edition
        window.editSiteTitle = () => {
            if(!isAdmin) return;
            const el = document.getElementById('siteTitleDisplay');
            el.outerHTML = `<input id="siteTitleInput" type="text" value="${el.textContent}" class="text-xl font-bold bg-popYellow px-3 py-0.5 rounded pop-border shadow-[2px_2px_0_0_#1a1a1a] w-36 focus:outline-none" onblur="window.saveSiteTitle(this.value)" onkeydown="if(event.key==='Enter') this.blur();" autofocus>`;
            document.getElementById('editTitleBtn').classList.add('hidden');
            setTimeout(()=>document.getElementById('siteTitleInput').focus(), 10);
        };
        window.saveSiteTitle = async (v) => {
            v = v.trim();
            if(v) try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), {siteTitle: v}, {merge:true}); }catch(e){}
            const el = document.getElementById('siteTitleInput');
            if(el) { el.outerHTML = `<h1 id="siteTitleDisplay" class="text-xl font-bold tracking-widest text-popInk bg-popYellow px-3 py-0.5 rounded pop-border shadow-[2px_2px_0_0_#1a1a1a]">${v||'知識庫'}</h1>`; document.getElementById('editTitleBtn').classList.remove('hidden'); }
        };

        // Category Management
        window.renderCategoryManager = () => {
            const list = document.getElementById('categoryManagerList');
            if(!systemCategories.length) return list.innerHTML = '<div class="text-sm font-bold text-center py-3 text-gray-500">無分類。</div>';
            list.innerHTML = systemCategories.map(c => `
                <div class="flex justify-between items-center py-2 px-2 bg-white pop-border rounded">
                    <span class="text-sm font-bold" id="cat-name-${c.id}">${c.name}</span>
                    <div class="flex gap-2" id="cat-acts-${c.id}">
                        <button onclick="window.editCategoryUI('${c.id}', '${c.name}')" class="bg-popYellow pop-border rounded px-2 py-0.5 text-xs font-bold transition-colors hover:bg-yellow-400"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="window.deleteCategoryUI(this, '${c.id}')" class="bg-popRed text-white pop-border rounded px-2 py-0.5 text-xs font-bold transition-colors hover:bg-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`).join('');
        };
        window.editCategoryUI = (id, old) => {
            document.getElementById(`cat-name-${id}`).innerHTML = `<input type="text" id="cat-input-${id}" value="${old}" class="w-full text-sm font-bold pop-border rounded px-1.5 py-0.5">`;
            document.getElementById(`cat-acts-${id}`).innerHTML = `<button onclick="window.saveCategory('${id}')" class="bg-popGreen text-white pop-border rounded px-2 py-0.5 text-xs font-bold">存</button>`;
        };
        window.saveCategory = async (id) => {
            const v = document.getElementById(`cat-input-${id}`).value.trim();
            if(v) try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', id), {name:v}); }catch(e){}
        };
        window.deleteCategoryUI = async (btn, id) => {
            if(btn.dataset.c!=='1') { btn.dataset.c='1'; btn.innerHTML='?'; setTimeout(()=> {if(btn){btn.dataset.c='0';btn.innerHTML='<i class="fa-solid fa-trash"></i>';}},3000); return; }
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categories', id)); }catch(e){}
        };
        window.handleAddCategory = async (e) => {
            e.preventDefault(); const v = document.getElementById('newCategoryName').value.trim(); if(!v) return;
            try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), {name:v}); document.getElementById('newCategoryName').value=''; }catch(e){}
        };

        // --- Simulated Auth Logic ---
        window.handleAuth = async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('passwordInput').value, err = document.getElementById('authError'), btn = document.getElementById('authSubmitBtn');
            btn.disabled = true; err.classList.add('hidden');
            try {
                if (authMode === 'admin') {
                    const cRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    let snap = await getDoc(cRef), aPwd = 'admin123';
                    if (snap.exists() && snap.data().adminPassword) aPwd = snap.data().adminPassword;
                    else await setDoc(cRef, { adminPassword: 'admin123' }, { merge: true });
                    if (pwd === aPwd) { currentAppUser = '管理員'; currentAppRole = 'admin'; }
                    else throw new Error('密碼錯誤！');
                } else {
                    const usr = document.getElementById('usernameInput').value.trim();
                    const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'collaborators', usr));
                    if (snap.exists() && snap.data().password === pwd) { currentAppUser = usr; currentAppRole = 'collab'; }
                    else throw new Error('帳密錯誤！');
                }
                updateAuthUI(); closeModal('authModal');
            } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); } finally { btn.disabled = false; }
        };
        window.handleLogout = () => { currentAppUser=null; currentAppRole=null; updateAuthUI(); };

        window.handleChangePassword = async (e) => {
            e.preventDefault();
            const cPwd = document.getElementById('currentPwd').value, nPwd = document.getElementById('newPwd').value;
            const err = document.getElementById('pwdError'), suc = document.getElementById('pwdSuccess'), btn = document.getElementById('pwdSubmitBtn');
            err.classList.add('hidden'); suc.classList.add('hidden'); btn.disabled=true;
            try {
                if (currentAppRole === 'admin') {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                    const snap = await getDoc(ref);
                    if (snap.exists() && snap.data().adminPassword !== cPwd) throw new Error('舊密碼錯誤');
                    await setDoc(ref, { adminPassword: nPwd }, { merge: true });
                } else {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'collaborators', currentAppUser);
                    const snap = await getDoc(ref);
                    if (snap.data().password !== cPwd) throw new Error('舊密碼錯誤');
                    await updateDoc(ref, { password: nPwd });
                }
                suc.classList.remove('hidden'); setTimeout(()=>closeModal('passwordModal'), 1500);
            } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); } finally { btn.disabled=false; }
        };

        window.handleAddCollaborator = async (e) => {
            e.preventDefault(); if(!isAdmin) return;
            const usr = document.getElementById('newCollabUsername').value.trim(), pwd = document.getElementById('newCollabPwd').value;
            const msg = document.getElementById('collabMsg'), btn = document.getElementById('collabSubmitBtn');
            msg.className='hidden'; btn.disabled=true;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'collaborators', usr);
                if ((await getDoc(ref)).exists()) throw new Error('帳號已存在');
                await setDoc(ref, { password: pwd, createdAt: Date.now() });
                msg.className='mb-3 p-2 bg-popGreen text-white text-sm font-bold rounded pop-border text-center'; msg.textContent='建立成功！'; document.getElementById('addCollabForm').reset();
            } catch (e) { msg.className='mb-3 p-2 bg-popRed text-white text-sm font-bold rounded pop-border text-center'; msg.textContent=e.message; } finally { btn.disabled=false; }
        };

        // --- CRUD ---
        window.handleSaveItem = async (e) => {
            e.preventDefault(); if(!currentAppRole) return;
            const err = document.getElementById('itemFormError'); err.classList.add('hidden');
            const id = document.getElementById('itemId').value, title = document.getElementById('itemTitle').value.trim(), dUrl = document.getElementById('itemDriveUrl').value.trim(), wUrl = document.getElementById('itemWebsiteUrl').value.trim(), cat = document.getElementById('itemCategory').value.trim();
            if(!dUrl && !wUrl) return err.classList.remove('hidden');
            const btn = document.getElementById('itemSubmitBtn'); btn.disabled=true;
            try {
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'links');
                if(id) await updateDoc(doc(ref, id), {title, driveUrl:dUrl, websiteUrl:wUrl, category:cat});
                else await addDoc(ref, {title, driveUrl:dUrl, websiteUrl:wUrl, category:cat, createdAt:Date.now(), creatorName:currentAppUser, views:0});
                closeModal('itemModal');
            } catch(e) { alert("儲存失敗"); } finally { btn.disabled=false; }
        };

        window.editItem = (id) => {
            const i = allLinks.find(l=>l.id===id); if(!i) return;
            document.getElementById('itemId').value = i.id; document.getElementById('itemTitle').value = i.title;
            document.getElementById('itemDriveUrl').value = i.driveUrl!==undefined?i.driveUrl:(i.type==='document'?i.url:'');
            document.getElementById('itemWebsiteUrl').value = i.websiteUrl!==undefined?i.websiteUrl:(i.type==='website'?i.url:'');
            document.getElementById('itemCategory').value = i.category||'';
            document.getElementById('itemModalTitle').textContent = '編輯資料';
            document.getElementById('itemModal').classList.remove('hidden');
        };

        window.deleteItem = async (id) => {
            const btn = event.currentTarget;
            if(btn.dataset.c!=='1'){ btn.dataset.c='1'; btn.textContent='確認?'; setTimeout(()=>{if(btn){btn.dataset.c='0';btn.textContent='刪除';}},3000); return;}
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'links', id)); }catch(e){}
        };
    </script>
</body>
</html>
