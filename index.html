<!DOCTYPE html>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/ButTaiwan/iansui@0.9.1/webfont/iansui.css');
        
        body {
            background-color: #FFF6F5; /* 非常淺的粉白色底 */
            color: #1A1A1A;
            font-family: 'Iansui', sans-serif;
            overflow-x: hidden;
        }
        
        /* Neobrutalism (普普風) Utilities */
        .pop-border {
            border: 3px solid #1A1A1A;
        }
        .pop-border-thick {
            border: 4px solid #1A1A1A;
        }
        .pop-shadow {
            box-shadow: 4px 4px 0 0 #1A1A1A;
        }
        .pop-shadow-lg {
            box-shadow: 6px 6px 0 0 #1A1A1A;
        }
        .pop-btn {
            border: 3px solid #1A1A1A;
            box-shadow: 4px 4px 0 0 #1A1A1A;
            transition: all 0.15s ease-in-out;
        }
        .pop-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 0 #1A1A1A;
        }
        .pop-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 0 #1A1A1A;
        }
        
        /* Card Hover Effect */
        .pop-card {
            transition: all 0.2s ease;
        }
        .pop-card:hover {
            transform: translateY(-4px) rotate(-1deg);
            box-shadow: 8px 8px 0 0 #1A1A1A;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #FFF6F5;
            border-left: 3px solid #1A1A1A;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFD13B; 
            border: 3px solid #1A1A1A;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF4D4D; 
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        popBg: '#FFF6F5',
                        popRed: '#FF4D4D',

                        popPink: '#FF8EB3',

                        <i class="fa-solid fa-star text-popInk text-xl"></i>
                    </div>

            <div class="col-span-full flex justify-center py-16 text-popRed">

            <span id="pageInfo" class="text-lg font-bold text-popInk">0 of 0</span>

                    <i class="fa-solid fa-arrow-left"></i> 上頁
                </button>
                <button id="nextBtn" onclick="changePage(1)" class="px-5 py-2 bg-popBg pop-btn rounded-xl font-bold text-lg disabled:opacity-50 disabled:cursor-not-allowed">
                    下頁 <i class="fa-solid fa-arrow-right"></i>

            <div class="absolute -top-6 -right-6">
                <button onclick="closeAuthModal()" class="bg-popRed text-white pop-border rounded-full w-12 h-12 flex items-center justify-center pop-btn text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <h2 class="text-3xl font-bold text-popInk mb-6 tracking-wide text-center uppercase" id="authTitle">Login</h2>

                <button id="tabCollab" type="button" onclick="setAuthMode('login')" class="flex-1 py-3 text-lg font-bold text-popInk bg-popYellow pop-border-thick border-b-0 rounded-t-xl transition translate-y-[3px]">協作者</button>

                    <label class="block text-lg font-bold text-popInk mb-2">帳號 ID</label>
                    <input type="text" id="usernameInput" class="w-full px-5 py-3 bg-popBg pop-border rounded-xl focus:outline-none focus:bg-white text-lg font-bold transition">

                <div class="mb-8">
                    <label class="block text-lg font-bold text-popInk mb-2">密碼</label>

            <div class="mt-8 p-5 bg-popYellow/30 rounded-2xl text-sm text-popInk pop-border font-bold">

                <p>• <strong>管理員</strong>：預設密碼 <b>admin123</b>，登入後可修改。擁有所有權限。</p>
                <p>• <strong>協作者</strong>：由管理員建立帳號，僅能管理自己的內容。</p>

    <div id="passwordModal" class="fixed inset-0 bg-popInk/40 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl pop-shadow-lg pop-border-thick w-full max-w-sm p-8 transform scale-95 transition-transform duration-300 relative">
            <button onclick="closePasswordModal()" class="absolute -top-6 -right-6 bg-popRed text-white pop-border rounded-full w-12 h-12 flex items-center justify-center pop-btn text-xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-bold text-popInk mb-6 text-center">修改密碼</h2>

                <div class="mb-8">

                <div class="mb-8">
                    <label class="block text-lg font-bold text-popInk mb-2">預設密碼</label>
                    <input type="text" id="newCollabPwd" required minlength="6" class="w-full px-4 py-3 bg-popBg pop-border rounded-xl focus:outline-none font-bold" placeholder="至少6碼">

                <input type="hidden" id="itemId">

                    <label class="block text-xl font-bold text-popInk mb-2">標題</label>
                    <input type="text" id="itemTitle" required class="w-full px-4 py-3 bg-popBg pop-border rounded-xl focus:bg-white text-lg font-bold outline-none">
                </div>

                <div class="mb-6 p-4 bg-popYellow/20 rounded-2xl pop-border">
                    <label class="block text-lg font-bold text-popInk mb-2"><i class="fa-solid fa-globe text-popPink drop-shadow-[1px_1px_0_#1A1A1A]"></i> 一般網站連結</label>

                <button type="submit" class="w-full bg-popGreen text-white rounded-xl font-bold py-4 text-xl pop-btn uppercase tracking-wide" id="itemSubmitBtn">儲存</button>

    <div id="categoryModal" class="fixed inset-0 bg-popInk/40 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">

            <button onclick="closeCategoryModal()" class="absolute -top-6 -right-6 bg-popRed text-white pop-border rounded-full w-12 h-12 flex items-center justify-center pop-btn text-xl"><i class="fa-solid fa-xmark"></i></button>

            <div class="max-h-60 overflow-y-auto bg-popBg pop-border rounded-2xl p-4 custom-scrollbar" id="categoryManagerList">

            </div>
        </div>

    <!-- Scripts: Firebase & Application Logic -->

        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === 1. Firebase Initialization ===
           const firebaseConfig = {
  apiKey: "AIzaSyC_hAeSmuRluu6sNvgGvY95NxS3DPjuzWg",
  authDomain: "website-a6054.firebaseapp.com",
  projectId: "website-a6054",
  storageBucket: "website-a6054.firebasestorage.app",
  messagingSenderId: "574297102239",
  appId: "1:574297102239:web:d66832373222f7185b4faa"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // === 2. Global State ===
        let currentAppUser = null; 
        let currentAppRole = null; 
        let currentUser = null;    
        let isAdmin = false;
        
        let allLinks = [];
        let filteredLinks = [];
        let systemCategories = [];
        
        // Pagination
        let currentPage = 1;
        const itemsPerPage = 12;

        let authMode = 'login'; 
        const ADMIN_INTERNAL_EMAIL = 'admin@wafu.local';

        const DOM = {
            search: document.getElementById('searchInput'),
            category: document.getElementById('categoryFilter'),
            container: document.getElementById('linksContainer'),
            pagination: document.getElementById('pagination'),
            pageInfo: document.getElementById('pageInfo'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn')
        };

        // === 3. Auth Setup ===
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Init Error:", error);
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupFirestoreListener();
            } else {
                currentUser = null;
            }
        });

        window.updateAuthUI = () => {

                    document.getElementById('manageUsersBtn').classList.remove('hidden');

                logoutBtn.classList.add('hidden');
                addBtn.classList.add('hidden');

            applyFiltersAndRender();

        // === 4. Data Fetching ===
        let unsubscribeLinks = null;
        let unsubscribeConfig = null;
        let unsubscribeCategories = null;

        function setupFirestoreListener() {
            if (unsubscribeLinks) unsubscribeLinks();
            if (unsubscribeConfig) unsubscribeConfig();
            if (unsubscribeCategories) unsubscribeCategories();
            if (!currentUser) return; 

            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().siteTitle) {
                    const titleEl = document.getElementById('siteTitleDisplay');
                    if(titleEl && titleEl.tagName === 'SPAN') {
                        titleEl.textContent = docSnap.data().siteTitle;
                    }
                    document.title = docSnap.data().siteTitle + " | 童趣知識庫";
                }
            });

            const catRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
            unsubscribeCategories = onSnapshot(catRef, (snapshot) => {
                systemCategories = [];
                snapshot.forEach(doc => {
                    systemCategories.push({ id: doc.id, ...doc.data() });
                });
                systemCategories.sort((a,b) => a.name.localeCompare(b.name));
                updateCategories();
                if(!document.getElementById('categoryModal').classList.contains('hidden')) {
                    window.renderCategoryManager();
                }
            });

            const linksRef = collection(db, 'artifacts', appId, 'public', 'data', 'links');
            unsubscribeLinks = onSnapshot(linksRef, (snapshot) => {
                allLinks = [];
                snapshot.forEach((doc) => {
                    allLinks.push({ id: doc.id, ...doc.data() });
                });
                updateCategories();
                applyFiltersAndRender();
            }, (error) => {
                console.error("Firestore Error:", error);
                DOM.container.innerHTML = `<div class="col-span-full text-center text-popRed font-bold p-8 bg-popRed/10 rounded-2xl pop-border">讀取資料失敗，請確認連線。</div>`;
            });
        }

        // === 5. Filtering, Sorting, and Pagination ===
        function updateCategories() {
            const currentFilterVal = DOM.category.value;
            DOM.category.innerHTML = `<option value="all">🌟 全部</option>` + 
                systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            if (systemCategories.find(c => c.name === currentFilterVal)) {
                DOM.category.value = currentFilterVal;
            } else {
                DOM.category.value = 'all';
            }

            const itemCatSelect = document.getElementById('itemCategory');
            if(itemCatSelect) {
                const currentItemCat = itemCatSelect.value;
                itemCatSelect.innerHTML = systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                if (currentItemCat && systemCategories.find(c => c.name === currentItemCat)) {
                    itemCatSelect.value = currentItemCat;
                }
            }
        }

        function applyFiltersAndRender() {
            const searchTerm = DOM.search.value.toLowerCase().trim();
            const categoryFilter = DOM.category.value;

            filteredLinks = allLinks.filter(link => {
                const matchSearch = link.title.toLowerCase().includes(searchTerm) || 
                                    (link.category && link.category.toLowerCase().includes(searchTerm));
                const matchCategory = categoryFilter === 'all' || link.category === categoryFilter;
                return matchSearch && matchCategory;
            });

            filteredLinks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            if ((currentPage - 1) * itemsPerPage >= filteredLinks.length) {
                currentPage = 1;
            }
            renderLinks();
        }

        function renderLinks() {
            if (filteredLinks.length === 0) {
                DOM.container.innerHTML = `
                    <div class="col-span-full text-center py-24 text-popInk border-[4px] border-dashed border-popInk rounded-3xl bg-popYellow/20">
                        <i class="fa-solid fa-face-frown-open text-6xl mb-6 text-popInk drop-shadow-[2px_2px_0_#fff]"></i>
                        <p class="font-bold text-2xl tracking-wide">空空如也！</p>
                    </div>`;
                DOM.pagination.classList.add('hidden');
                return;
            }

            const totalPages = Math.ceil(filteredLinks.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredLinks.slice(startIndex, endIndex);

            DOM.container.innerHTML = pageData.map((link, idx) => generateCardHTML(link, idx)).join('');

            DOM.pagination.classList.remove('hidden');
            DOM.pageInfo.textContent = `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
            DOM.prevBtn.disabled = currentPage === 1;
            DOM.nextBtn.disabled = currentPage === totalPages;
        }

        function generateCardHTML(link, idx) {
            const dateStr = link.createdAt ? new Date(link.createdAt).toLocaleDateString('zh-TW') : '';
            const views = link.views || 0;
            const dUrl = link.driveUrl || (link.type === 'document' ? link.url : '');
            const wUrl = link.websiteUrl || (link.type === 'website' ? link.url : '');

            let creatorDisplay = '匿名';
            if (link.creatorName) {
                creatorDisplay = link.creatorName;
            } else if (link.creatorEmail) {
                creatorDisplay = link.creatorEmail.includes('@') ? '管理員' : link.creatorEmail; 
            }

            let canEdit = false;
            if (currentAppRole === 'admin') {
                canEdit = true;
            } else if (currentAppRole === 'collab' && currentAppUser) {
                if (link.creatorName === currentAppUser || (link.creatorEmail && link.creatorEmail.includes(currentAppUser))) {
                    canEdit = true;
                }
            }

            const actionsHtml = canEdit ? `
                <div class="flex gap-2 mt-4 pt-4 border-t-[3px] border-popInk">
                    <button onclick="editItem('${link.id}')" class="text-sm font-bold text-popInk hover:bg-popYellow transition px-3 py-1.5 bg-white pop-border rounded-lg pop-shadow"><i class="fa-solid fa-pen"></i> 編輯</button>
                    <button onclick="deleteItem('${link.id}')" class="text-sm font-bold text-white transition px-3 py-1.5 bg-popRed pop-border rounded-lg pop-shadow"><i class="fa-solid fa-trash"></i> 刪除</button>
                </div>
            ` : '';

            let linksHtml = '';
            if (dUrl) {
                linksHtml += `<a href="${dUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${dUrl}')" class="inline-flex items-center gap-1.5 text-base font-bold text-white bg-popBlue px-4 py-2 rounded-xl pop-border pop-btn"><i class="fa-brands fa-google-drive"></i> 文件</a>`;
            }
            if (wUrl) {
                linksHtml += `<a href="${wUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${wUrl}')" class="inline-flex items-center gap-1.5 text-base font-bold text-popInk bg-popPink px-4 py-2 rounded-xl pop-border pop-btn"><i class="fa-solid fa-globe"></i> 網站</a>`;
            }
            
            // Alternating card tilt
            const tiltClass = idx % 2 === 0 ? '-rotate-1 hover:-rotate-2' : 'rotate-1 hover:rotate-2';

            return `
                <div class="bg-white p-6 rounded-2xl pop-border-thick pop-shadow-lg pop-card flex flex-col justify-between h-full relative ${tiltClass}">
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="inline-block px-3 py-1 bg-popYellow font-bold text-sm text-popInk rounded-xl pop-border tracking-wider">${link.category || '未分類'}</span>
                            <span class="text-sm font-bold text-popInk flex items-center gap-1 bg-white px-2.5 py-1 rounded-xl pop-border">
                                <i class="fa-solid fa-eye text-popPink"></i> ${views}
                            </span>
                        </div>
                        <h3 class="text-2xl font-bold text-popInk mb-5 leading-snug">${link.title}</h3>
                        <div class="flex flex-wrap gap-3 mb-4">
                            ${linksHtml}
                        </div>
                    </div>
                    
                    <div class="mt-auto">
                        <div class="flex justify-between items-center text-sm font-bold text-popInk border-t-[3px] border-popInk pt-4">
                            <span class="flex items-center gap-1"><i class="fa-solid fa-user-astronaut text-popPurple"></i> ${creatorDisplay}</span>
                            <span>${dateStr}</span>
                        </div>
                        ${actionsHtml}
                    </div>
                </div>
            `;
        }

        // === 6. Event Listeners for Filters ===
        ['input', 'change'].forEach(evt => DOM.search.addEventListener(evt, () => { currentPage = 1; applyFiltersAndRender(); }));
        DOM.category.addEventListener('change', () => { currentPage = 1; applyFiltersAndRender(); });

        window.changePage = (delta) => {

            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 建立中...';

            try {
                const collabRef = doc(db, 'artifacts', appId, 'public', 'data', 'collaborators', username);
                const collabSnap = await getDoc(collabRef);
                
                if (collabSnap.exists()) {
                    throw new Error('此帳號名稱已經被使用了。');
                }

                await setDoc(collabRef, { password: pwd, createdAt: Date.now() });
                
                msgDiv.classList.add('bg-popGreen/20', 'text-popGreen');
                msgDiv.innerHTML = `成功！協作者 <b>${username}</b> 已建立。`;
                msgDiv.classList.remove('hidden');
                document.getElementById('addCollabForm').reset();
            } catch (error) {
                msgDiv.classList.add('bg-popRed/20', 'text-popRed');
                msgDiv.innerHTML = `建立失敗：${error.message}`;
                msgDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
            }
        };

        // --- CRUD Actions ---
        window.handleSaveItem = async (e) => {
            e.preventDefault();
            if (!currentAppRole) return;
            
            const errorDiv = document.getElementById('itemFormError');
            errorDiv.classList.add('hidden');

            const id = document.getElementById('itemId').value;
            const title = document.getElementById('itemTitle').value.trim();
            const driveUrl = document.getElementById('itemDriveUrl').value.trim();
            const websiteUrl = document.getElementById('itemWebsiteUrl').value.trim();
            const category = document.getElementById('itemCategory').value.trim();
            
            if (!driveUrl && !websiteUrl) {
                errorDiv.classList.remove('hidden');
                return;
            }

            const submitBtn = document.getElementById('itemSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存中...';

            const data = {
                title,
                driveUrl,
                websiteUrl,
                category,
            };

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'links');
                if (id) {
                    const docRef = doc(colRef, id);
                    await updateDoc(docRef, data);
                } else {
                    data.createdAt = Date.now();
                    data.creatorName = currentAppUser; 
                    data.views = 0;
                    await addDoc(colRef, data);
                }
                window.closeItemModal();
            } catch (error) {
                console.error("Error saving document: ", error);
                alert("儲存失敗，請檢查權限或網路。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '儲存';
            }
        };

        window.editItem = (id) => {
            const item = allLinks.find(l => l.id === id);
            if (!item) return;

            document.getElementById('itemId').value = item.id;
            document.getElementById('itemTitle').value = item.title;
            const dUrl = item.driveUrl !== undefined ? item.driveUrl : (item.type === 'document' ? item.url : '');
            const wUrl = item.websiteUrl !== undefined ? item.websiteUrl : (item.type === 'website' ? item.url : '');
            document.getElementById('itemDriveUrl').value = dUrl;
            document.getElementById('itemWebsiteUrl').value = wUrl;
            document.getElementById('itemCategory').value = item.category || '';
            document.getElementById('itemFormError').classList.add('hidden');
            
            document.getElementById('itemModalTitle').textContent = '編輯項目';
            itemModal.classList.remove('hidden');
            setTimeout(() => {
                itemModal.classList.remove('opacity-0');
                itemModal.querySelector('div').classList.remove('scale-95');
            }, 10);
        };

        window.deleteItem = async (id) => {
            const btn = event.currentTarget;
            if (btn.dataset.confirm !== 'true') {
                btn.dataset.confirm = 'true';
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 確認?';
                btn.classList.replace('bg-popRed', 'bg-popInk');
                
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = 'false';
                        btn.innerHTML = originalHtml;
                        btn.classList.replace('bg-popInk', 'bg-popRed');
                    }
                }, 3000);
                return;
            }

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'links', id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting: ", error);
            }
        };
    </script>
</body>
</html>
