<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中式知識庫 | 文件與網站分享</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Noto Serif TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rice: '#FDFBF7',         // 宣紙白 (背景)
                        crimson: '#8B1A1A',      // 暗紅/中國紅 (主按鈕/強調)
                        crimsonDark: '#631212',  // 暗紅深色 (標題/懸停)
                        alert: '#B91C1C',        // 警告紅 (刪除)
                        ink: '#2B2B2B',          // 墨黑 (文字)
                        border: '#E6E2D8',       // 窗花邊框色
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FDFBF7;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e6e2d8' fill-opacity='0.5'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: #2B2B2B;
            font-family: 'Noto Sans TC', sans-serif;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Noto Serif TC', serif;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 26, 26, 0.08);
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;

</head>
<body class="min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-border shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-stamp text-crimson text-2xl"></i>
                    <div class="flex items-center">
                        <h1 id="siteTitleDisplay" class="text-2xl font-serif font-bold text-crimsonDark tracking-wider">中式知識庫</h1>
                        <button id="editTitleBtn" onclick="editSiteTitle()" class="hidden text-crimson hover:text-crimsonDark ml-2" title="修改網站名稱"><i class="fa-solid fa-pen text-sm"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="userInfo" class="hidden text-sm text-ink items-center gap-2">
                        <i class="fa-regular fa-circle-user text-lg"></i>
                        <span id="userEmail" class="hidden sm:inline"></span>
                        <span id="userRoleBadge" class="px-2 py-0.5 rounded text-xs text-white bg-crimson"></span>
                        <button onclick="openPasswordModal()" class="text-gray-500 hover:text-crimson ml-1 transition" title="修改密碼"><i class="fa-solid fa-key"></i></button>
                    </div>
                    <button id="addBtn" onclick="openAddModal()" class="hidden bg-crimson hover:bg-crimsonDark text-white px-4 py-2 rounded-md text-sm transition shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> 新增項目
                    </button>
                    <button id="loginBtn" onclick="openAuthModal()" class="border border-crimson text-crimson hover:bg-crimson hover:text-white px-4 py-2 rounded-md text-sm transition">
                        <i class="fa-solid fa-right-to-bracket mr-1"></i> 登入/註冊
                    </button>
                    <button id="logoutBtn" onclick="handleLogout()" class="hidden border border-border text-ink hover:bg-gray-100 px-4 py-2 rounded-md text-sm transition">
                        登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Controls Section (Search & Filters) -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-border mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/3 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="關鍵字搜尋文件與網站..." 
                    class="w-full pl-10 pr-4 py-2 bg-rice border border-border rounded-md focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition">
            </div>
            
            <div class="w-full md:w-2/3 flex flex-col sm:flex-row gap-4 justify-end">
                <div class="flex items-center gap-2">
                    <label class="text-sm text-gray-500 whitespace-nowrap">分類:</label>
                    <select id="categoryFilter" class="bg-rice border border-border rounded-md px-3 py-2 text-sm focus:outline-none focus:border-crimson w-full sm:w-auto min-w-[120px]">
                        <option value="all">所有分類</option>
                        <!-- Dynamic categories will be populated here -->
                    </select>
                    <button id="manageCatBtn" onclick="openCategoryModal()" class="hidden bg-rice border border-border text-ink hover:text-crimson px-3 py-2 rounded-md text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-tags"></i> 分類管理
                    </button>
                    <button id="manageUsersBtn" onclick="openCollaboratorModal()" class="hidden bg-rice border border-border text-ink hover:text-crimson px-3 py-2 rounded-md text-sm transition whitespace-nowrap">
                        <i class="fa-solid fa-users"></i> 協作者管理
                    </button>
                </div>
            </div>
        </div>

        <!-- Links Grid -->
        <div id="linksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 mb-8">
            <!-- Loading indicator -->
            <div class="col-span-full flex justify-center py-12 text-crimson">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl"></i>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-border hidden">
            <span id="pageInfo" class="text-sm text-gray-500">顯示 0 筆中的 0 筆</span>
            <div class="flex gap-2">
                <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1 border border-border rounded hover:bg-rice disabled:opacity-50 transition"><i class="fa-solid fa-chevron-left"></i> 上一頁</button>
                <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1 border border-border rounded hover:bg-rice disabled:opacity-50 transition">下一頁 <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-border mt-auto py-6">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-gray-400">
            &copy; 2026 知識庫系統.
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300 border-t-4 border-crimson">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-serif font-bold text-crimsonDark" id="authTitle">帳號登入</h2>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- Auth Mode Tabs -->
            <div class="flex border-b border-border mb-4">
                <button id="tabCollab" type="button" onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-bold text-crimson border-b-2 border-crimson transition">協作者</button>
                <button id="tabAdmin" type="button" onclick="setAuthMode('admin')" class="flex-1 py-2 text-sm text-gray-500 hover:text-crimson transition">管理員</button>
            </div>

            <div id="authError" class="hidden mb-4 p-3 bg-red-50 text-alert text-sm rounded border border-red-100"></div>
            
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="mb-4" id="usernameInputContainer">
                    <label class="block text-sm font-medium text-gray-700 mb-1">登入帳號</label>
                    <input type="text" id="usernameInput" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="請輸入帳號 (例如: user01)">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                    <input type="password" id="passwordInput" required minlength="6" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="請輸入密碼">
                </div>
                <button type="submit" class="w-full bg-crimson hover:bg-crimsonDark text-white font-medium py-2 rounded transition" id="authSubmitBtn">登入</button>
            </form>
            
            <div class="mt-4 p-3 bg-rice rounded text-xs text-gray-500 border border-border">
                <p>💡 <strong>權限說明：</strong></p>
                <p>• <strong>管理員</strong>：擁有所有修改與刪除權限。(預設密碼為 <b>admin123</b>，登入後可修改)</p>
                <p>• <strong>協作者</strong>：由管理員建立帳號，僅能管理自己新增的文件與網站。</p>
            </div>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-300 border-t-4 border-crimson">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-serif font-bold text-crimsonDark">修改密碼</h2>
                <button onclick="closePasswordModal()" class="text-gray-400 hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="pwdError" class="hidden mb-4 p-2 bg-red-50 text-alert text-sm rounded border border-red-100"></div>
            <div id="pwdSuccess" class="hidden mb-4 p-2 bg-green-50 text-green-700 text-sm rounded border border-green-100">密碼修改成功！</div>
            
            <form id="passwordForm" onsubmit="handleChangePassword(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">目前的密碼</label>
                    <input type="password" id="currentPwd" required class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">新密碼 (至少6碼)</label>
                    <input type="password" id="newPwd" required minlength="6" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson">
                </div>
                <button type="submit" class="w-full bg-crimson hover:bg-crimsonDark text-white font-medium py-2 rounded transition" id="pwdSubmitBtn">確認修改</button>
            </form>
        </div>
    </div>

    <!-- Collaborator Management Modal -->
    <div id="collaboratorModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300 border-t-4 border-crimson">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-serif font-bold text-crimsonDark">新增協作者帳號</h2>
                <button onclick="closeCollaboratorModal()" class="text-gray-400 hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="collabMsg" class="hidden mb-4 p-2 text-sm rounded border"></div>
            
            <form id="addCollabForm" onsubmit="handleAddCollaborator(event)">
                <p class="text-xs text-gray-500 mb-4">在此建立新的協作者帳號。建立後，協作者即可使用此帳號與密碼登入，並可自行修改密碼。</p>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">協作者帳號</label>
                    <input type="text" id="newCollabUsername" required class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="請設定一組簡短帳號 (英數字)">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">預設密碼 (至少6碼)</label>
                    <input type="text" id="newCollabPwd" required minlength="6" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="例如：123456">
                </div>
                <button type="submit" class="w-full bg-crimson hover:bg-crimsonDark text-white font-medium py-2 rounded transition" id="collabSubmitBtn">建立帳號</button>
            </form>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 transform scale-95 transition-transform duration-300 border-t-4 border-crimson">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-serif font-bold text-crimsonDark" id="itemModalTitle">新增項目</h2>
                <button onclick="closeItemModal()" class="text-gray-400 hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="itemForm" onsubmit="handleSaveItem(event)">
                <input type="hidden" id="itemId">
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">標題名稱</label>
                    <input type="text" id="itemTitle" required class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fa-solid fa-globe text-crimson"></i> 一般網站連結 (選填)</label>
                    <input type="url" id="itemWebsiteUrl" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="https://...">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1"><i class="fa-brands fa-google-drive text-[#4285F4]"></i> 雲端硬碟文件連結 (選填)</label>
                    <input type="url" id="itemDriveUrl" class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson" placeholder="https://drive.google.com/...">
                </div>

                <div id="itemFormError" class="hidden mb-4 p-2 bg-red-50 text-alert text-sm rounded border border-red-100">請至少填寫一個連結！</div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">分類</label>
                    <select id="itemCategory" required class="w-full px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson">
                        <!-- Options generated dynamically -->
                    </select>
                </div>

                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeItemModal()" class="px-4 py-2 border border-border text-ink rounded hover:bg-rice transition">取消</button>
                    <button type="submit" class="px-4 py-2 bg-crimson hover:bg-crimsonDark text-white rounded transition" id="itemSubmitBtn">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Management Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300 border-t-4 border-crimson">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-serif font-bold text-crimsonDark">管理分類</h2>
                <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="addCategoryForm" onsubmit="handleAddCategory(event)" class="mb-4 flex gap-2">
                <input type="text" id="newCategoryName" required placeholder="新增分類名稱..." class="flex-grow px-3 py-2 bg-rice border border-border rounded focus:outline-none focus:border-crimson text-sm">
                <button type="submit" class="bg-crimson hover:bg-crimsonDark text-white px-3 py-2 rounded text-sm whitespace-nowrap transition">新增</button>
            </form>

            <div class="max-h-60 overflow-y-auto bg-rice border border-border rounded p-2" id="categoryManagerList">
                <!-- Categories listed here -->
            </div>
        </div>
    </div>

    <!-- Scripts: Firebase & Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // === 1. Firebase Initialization ===
    const firebaseConfig = {
  apiKey: "AIzaSyC_hAeSmuRluu6sNvgGvY95NxS3DPjuzWg",
  authDomain: "website-a6054.firebaseapp.com",
  projectId: "website-a6054",
  storageBucket: "website-a6054.firebasestorage.app",
  messagingSenderId: "574297102239",
  appId: "1:574297102239:web:d66832373222f7185b4faa"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // === 2. Global State ===
        let currentAppUser = null; // Simulated App User (Username or 'admin')
        let currentAppRole = null; // 'admin' or 'collab'
        let currentUser = null;    // Real Firebase Auth User (Anonymous)
        let isAdmin = false;
        
        let allLinks = [];
        let filteredLinks = [];
        let systemCategories = [];
        
        // Pagination
        let currentPage = 1;
        const itemsPerPage = 10;

        // Modals State
        let authMode = 'login'; // 'login', 'admin'

        // References to DOM Elements
        const DOM = {
            search: document.getElementById('searchInput'),
            category: document.getElementById('categoryFilter'),
            container: document.getElementById('linksContainer'),
            pagination: document.getElementById('pagination'),
            pageInfo: document.getElementById('pageInfo'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn')
        };

        // === 3. Auth Setup (Crucial Rule 3) ===
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Init Error:", error);
            }
        };

        // Start initialization
        initAuth();

        // Listen for Auth changes (Firebase level)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupFirestoreListener();
            } else {
                currentUser = null;
            }
        });

        // App Level UI Update
        window.updateAuthUI = () => {
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const addBtn = document.getElementById('addBtn');
            const userInfo = document.getElementById('userInfo');
            const userEmail = document.getElementById('userEmail');
            const roleBadge = document.getElementById('userRoleBadge');

            if (currentAppRole) {
                // Logged in (Simulated)
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                addBtn.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.classList.add('flex');
                
                if (currentAppRole === 'admin') {
                    isAdmin = true;
                    roleBadge.textContent = "管理員";
                    roleBadge.className = "px-2 py-0.5 rounded text-xs text-white bg-crimsonDark";
                    userEmail.classList.add('hidden');
                    document.getElementById('editTitleBtn').classList.remove('hidden');
                    document.getElementById('manageUsersBtn').classList.remove('hidden');
                } else {
                    isAdmin = false;
                    roleBadge.textContent = "協作者";
                    roleBadge.className = "px-2 py-0.5 rounded text-xs text-white bg-blue-600";
                    userEmail.textContent = currentAppUser;
                    userEmail.classList.remove('hidden');
                    document.getElementById('editTitleBtn').classList.add('hidden');
                    document.getElementById('manageUsersBtn').classList.add('hidden');
                }
                document.getElementById('manageCatBtn').classList.remove('hidden');
            } else {
                // Anonymous viewer
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                addBtn.classList.add('hidden');
                userInfo.classList.add('hidden');
                userInfo.classList.remove('flex');
                document.getElementById('editTitleBtn').classList.add('hidden');
                document.getElementById('manageCatBtn').classList.add('hidden');
                document.getElementById('manageUsersBtn').classList.add('hidden');
                isAdmin = false;
            }
            
            applyFiltersAndRender();
        }

        // === 4. Data Fetching ===
        let unsubscribeLinks = null;
        let unsubscribeConfig = null;
        let unsubscribeCategories = null;

        function setupFirestoreListener() {
            if (unsubscribeLinks) unsubscribeLinks();
            if (unsubscribeConfig) unsubscribeConfig();
            if (unsubscribeCategories) unsubscribeCategories();
            if (!currentUser) return; // Guard

            // Listen to Settings/Config (Title)
            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().siteTitle) {
                    const titleEl = document.getElementById('siteTitleDisplay');
                    if(titleEl && titleEl.tagName === 'H1') {
                        titleEl.textContent = docSnap.data().siteTitle;
                    }
                    document.title = docSnap.data().siteTitle + " | 知識庫系統";
                }
            });

            // Listen to Categories
            const catRef = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
            unsubscribeCategories = onSnapshot(catRef, (snapshot) => {
                systemCategories = [];
                snapshot.forEach(doc => {
                    systemCategories.push({ id: doc.id, ...doc.data() });
                });
                systemCategories.sort((a,b) => a.name.localeCompare(b.name));
                updateCategories();
                if(!document.getElementById('categoryModal').classList.contains('hidden')) {
                    window.renderCategoryManager();
                }
            });

            // Listen to Links
            const linksRef = collection(db, 'artifacts', appId, 'public', 'data', 'links');
            unsubscribeLinks = onSnapshot(linksRef, (snapshot) => {
                allLinks = [];
                snapshot.forEach((doc) => {
                    allLinks.push({ id: doc.id, ...doc.data() });
                });
                updateCategories();
                applyFiltersAndRender();
            }, (error) => {
                console.error("Firestore Error:", error);
                DOM.container.innerHTML = `<div class="col-span-full text-center text-alert p-4 bg-red-50 rounded">讀取資料失敗，請確認連線。</div>`;
            });
        }

        // === 5. Filtering, Sorting, and Pagination ===
        function updateCategories() {
            const currentFilterVal = DOM.category.value;
            DOM.category.innerHTML = `<option value="all">所有分類</option>` + 
                systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            if (systemCategories.find(c => c.name === currentFilterVal)) {
                DOM.category.value = currentFilterVal;
            } else {
                DOM.category.value = 'all';
            }

            const itemCatSelect = document.getElementById('itemCategory');
            if(itemCatSelect) {
                const currentItemCat = itemCatSelect.value;
                itemCatSelect.innerHTML = systemCategories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                if (currentItemCat && systemCategories.find(c => c.name === currentItemCat)) {
                    itemCatSelect.value = currentItemCat;
                }
            }
        }

        function applyFiltersAndRender() {
            const searchTerm = DOM.search.value.toLowerCase().trim();
            const categoryFilter = DOM.category.value;

            filteredLinks = allLinks.filter(link => {
                const matchSearch = link.title.toLowerCase().includes(searchTerm) || 
                                    (link.category && link.category.toLowerCase().includes(searchTerm));
                const matchCategory = categoryFilter === 'all' || link.category === categoryFilter;
                return matchSearch && matchCategory;
            });

            filteredLinks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            if ((currentPage - 1) * itemsPerPage >= filteredLinks.length) {
                currentPage = 1;
            }
            renderLinks();
        }

        function renderLinks() {
            if (filteredLinks.length === 0) {
                DOM.container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400 border-2 border-dashed border-border rounded-lg bg-white">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                        <p>未找到任何相關文件或網站</p>
                    </div>`;
                DOM.pagination.classList.add('hidden');
                return;
            }

            const totalPages = Math.ceil(filteredLinks.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredLinks.slice(startIndex, endIndex);

            DOM.container.innerHTML = pageData.map(link => generateCardHTML(link)).join('');

            DOM.pagination.classList.remove('hidden');
            DOM.pageInfo.textContent = `顯示 ${startIndex + 1} - ${Math.min(endIndex, filteredLinks.length)} 筆，共 ${filteredLinks.length} 筆`;
            DOM.prevBtn.disabled = currentPage === 1;
            DOM.nextBtn.disabled = currentPage === totalPages;
        }

        function generateCardHTML(link) {
            const dateStr = link.createdAt ? new Date(link.createdAt).toLocaleDateString('zh-TW') : '未知日期';
            const views = link.views || 0;
            const dUrl = link.driveUrl || (link.type === 'document' ? link.url : '');
            const wUrl = link.websiteUrl || (link.type === 'website' ? link.url : '');

            // Process creator display name
            let creatorDisplay = '匿名';
            if (link.creatorName) {
                creatorDisplay = link.creatorName;
            } else if (link.creatorEmail) {
                creatorDisplay = link.creatorEmail.includes('@') ? '管理員' : link.creatorEmail; // Legacy
            }

            // Permission Logic
            let canEdit = false;
            if (currentAppRole === 'admin') {
                canEdit = true;
            } else if (currentAppRole === 'collab' && currentAppUser) {
                if (link.creatorName === currentAppUser || (link.creatorEmail && link.creatorEmail.includes(currentAppUser))) {
                    canEdit = true;
                }
            }

            const actionsHtml = canEdit ? `
                <div class="flex gap-2 mt-3 pt-3 border-t border-border">
                    <button onclick="editItem('${link.id}')" class="text-xs text-crimson hover:underline"><i class="fa-solid fa-pen"></i> 編輯</button>
                    <button onclick="deleteItem('${link.id}')" class="text-xs text-alert hover:underline"><i class="fa-solid fa-trash"></i> 刪除</button>
                </div>
            ` : '';

            let linksHtml = '';
            if (dUrl) {
                linksHtml += `<a href="${dUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${dUrl}')" class="inline-flex items-center gap-1.5 text-sm text-[#4285F4] hover:text-blue-700 hover:underline bg-blue-50 px-2.5 py-1.5 rounded-md border border-blue-100 transition"><i class="fa-brands fa-google-drive"></i> 雲端文件</a>`;
            }
            if (wUrl) {
                linksHtml += `<a href="${wUrl}" target="_blank" onclick="window.incrementView(event, '${link.id}', ${views}, '${wUrl}')" class="inline-flex items-center gap-1.5 text-sm text-crimson hover:text-crimsonDark hover:underline bg-rice px-2.5 py-1.5 rounded-md border border-crimson/30 transition"><i class="fa-solid fa-globe"></i> 一般網站</a>`;
            }

            return `
                <div class="bg-white p-5 rounded-lg border border-border card-hover flex flex-col justify-between h-full relative">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block px-2 py-1 bg-rice text-xs text-gray-600 rounded-sm border border-border">${link.category || '未分類'}</span>
                            <span class="text-xs text-gray-400 flex items-center gap-1" title="觀看次數">
                                <i class="fa-regular fa-eye"></i> ${views}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-ink mb-3 line-clamp-2 leading-tight">${link.title}</h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${linksHtml}
                        </div>
                    </div>
                    
                    <div class="mt-auto">
                        <div class="flex justify-between items-center text-xs text-gray-400 border-t border-border/50 pt-2">
                            <span>建立者: ${creatorDisplay}</span>
                            <span>${dateStr}</span>
                        </div>
                        ${actionsHtml}
                    </div>
                </div>
            `;
        }

                btn.dataset.confirm = 'true';
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> 確認刪除?';
                btn.classList.replace('text-alert', 'text-white');
                btn.classList.add('bg-alert', 'px-2', 'py-1', 'rounded', '-my-1');
                
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = 'false';
                        btn.innerHTML = originalHtml;
                        btn.classList.replace('text-white', 'text-alert');
                        btn.classList.remove('bg-alert', 'px-2', 'py-1', 'rounded', '-my-1');
                    }
                }, 3000);
                return;
            }

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'links', id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting: ", error);
            }
        };
    </script>
</body>
</html>
